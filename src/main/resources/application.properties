spring.application.name=shopmcp
spring.ai.mcp.server.name=shopmcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

server.port=8088

spring.datasource.url=jdbc:mysql://localhost:3306/shopmcp?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${SHOPMCP_DB_USER}
spring.datasource.password=${SHOPMCP_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

logging.file.name=./logs/shopmcp.log
logging.level.root=INFO
logging.level.org.springframework.ai=DEBUG
