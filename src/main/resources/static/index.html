<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Assistant</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f6fb; color: #17243b; }
    .app { display: flex; flex-direction: column; max-width: 960px; min-height: 100dvh; margin: auto; background: #fff; box-shadow: 0 0 40px #1a33510d; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.1rem 1.5rem; border-bottom: 1px solid #e4e9f2; }
    h1 { margin: 0; font-size: 1.2rem; letter-spacing: -.02em; }
    .subtitle { margin: .25rem 0 0; color: #64748b; font-size: .9rem; }
    button { font: inherit; cursor: pointer; }
    .reset { border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; color: #334155; padding: .55rem .8rem; white-space: nowrap; }
    .reset:hover { background: #f1f5f9; }
    main { flex: 1; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; padding: 1.5rem; }
    .welcome { max-width: 620px; margin: auto; text-align: center; }
    .welcome h2 { margin: 0 0 .5rem; font-size: 1.6rem; }
    .welcome p { color: #64748b; line-height: 1.5; }
    .suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: .6rem; margin-top: 1.25rem; }
    .suggestions button { border: 1px solid #dbe4ef; border-radius: 999px; padding: .65rem .9rem; background: #f8fafc; color: #334155; }
    .suggestions button:hover { border-color: #94a3b8; background: #eef4ff; }
    .message { max-width: min(80%, 700px); padding: .8rem 1rem; border-radius: 14px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
    .message.user { align-self: flex-end; background: #2357c6; color: white; border-bottom-right-radius: 4px; }
    .message.assistant { align-self: flex-start; background: #f1f5f9; border-bottom-left-radius: 4px; }
    .message.error { background: #fff1f2; color: #9f1239; }
    form { display: flex; gap: .75rem; align-items: end; padding: 1rem 1.5rem 1.5rem; border-top: 1px solid #e4e9f2; }
    textarea { flex: 1; min-height: 48px; max-height: 180px; resize: vertical; border: 1px solid #cbd5e1; border-radius: 10px; padding: .75rem; font: inherit; line-height: 1.4; }
    textarea:focus { outline: 2px solid #93b4ff; border-color: #2357c6; }
    .send { min-height: 48px; border: 0; border-radius: 10px; padding: .7rem 1.15rem; background: #2357c6; color: #fff; font-weight: 600; }
    .send:hover { background: #1748af; }
    .send:disabled { opacity: .55; cursor: wait; }
    @media (max-width: 600px) { header, main, form { padding-left: 1rem; padding-right: 1rem; } .message { max-width: 92%; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div><h1>Task Assistant</h1><p class="subtitle">Chat with Gemini to manage your tasks</p></div>
      <button class="reset" id="reset" type="button">New conversation</button>
    </header>
    <main id="messages" role="log" aria-live="polite" aria-label="Conversation">
      <section class="welcome" id="welcome">
        <h2>What would you like to do?</h2>
        <p>Ask about your tasks, add a new one, or mark one as completed.</p>
        <div class="suggestions">
          <button type="button" data-prompt="How many tasks do I have?">Count my tasks</button>
          <button type="button" data-prompt="Show my pending tasks">Show pending tasks</button>
          <button type="button" data-prompt="Show my completed tasks">Show completed tasks</button>
        </div>
      </section>
    </main>
    <form id="chat-form">
      <textarea id="message" aria-label="Message" placeholder="Ask about your tasks…" rows="1" maxlength="4000" required></textarea>
      <button class="send" id="send" type="submit">Send</button>
    </form>
  </div>
  <script>
    const messages = document.getElementById('messages');
    const input = document.getElementById('message');
    const send = document.getElementById('send');
    const form = document.getElementById('chat-form');
    let conversationId = crypto.randomUUID();
    let busy = false;

    function addMessage(text, role, isError = false) {
      document.getElementById('welcome')?.remove();
      const bubble = document.createElement('div');
      bubble.className = `message ${role}${isError ? ' error' : ''}`;
      bubble.textContent = text;
      messages.appendChild(bubble);
      messages.scrollTop = messages.scrollHeight;
      return bubble;
    }

    async function sendMessage(text) {
      if (busy || !text.trim()) return;
      busy = true;
      send.disabled = true;
      input.value = '';
      addMessage(text.trim(), 'user');
      const pending = addMessage('Thinking…', 'assistant');
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text.trim(), conversationId })
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        pending.textContent = data.reply || 'The assistant returned an empty response.';
      } catch (error) {
        pending.classList.add('error');
        pending.textContent = 'The assistant could not reply. Please try again.';
      } finally {
        busy = false;
        send.disabled = false;
        input.focus();
        messages.scrollTop = messages.scrollHeight;
      }
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      sendMessage(input.value);
    });
    input.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
    document.querySelectorAll('[data-prompt]').forEach(button => {
      button.addEventListener('click', () => sendMessage(button.dataset.prompt));
    });
    document.getElementById('reset').addEventListener('click', () => {
      if (busy) return;
      conversationId = crypto.randomUUID();
      messages.replaceChildren();
      addMessage('New conversation started. What would you like to do?', 'assistant');
      input.focus();
    });
  </script>
</body>
</html>
